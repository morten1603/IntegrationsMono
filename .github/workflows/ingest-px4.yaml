# .github/workflows/ingest-px4-sitl.yml
name: Ingest PX4 SITL

on:
  workflow_dispatch:
    inputs:
      px4_version:
        required: true
        default: '1.17.0'

jobs:
  ingest-px4-sitl:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Ingest PX4 SITL
        env:
          PX4_VERSION: ${{ inputs.px4_version }}
          GITHUB_ORG: ${{ github.repository_owner }}
        run: bash ingestion/px4-sitl/ingest.sh